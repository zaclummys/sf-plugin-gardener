# Coverage is a diagnostic here, never a gate. The gate is .c8rc.nut.json, which fails
# the test job under 100%. Informational statuses keep Codecov reporting the number
# without ever failing a check, and the comment is off.
#
# The branch is pinned because Codecov takes its default from the first branch it ever
# receives an upload from, and a short-lived one would be served on the badge long after
# the branch is gone.

codecov:
    branch: main

coverage:
    status:
        project:
            default:
                informational: true
        patch:
            default:
                informational: true

comment: false
